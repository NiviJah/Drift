name: Release

# Builds the Android test APK and publishes it as a GitHub Release.
#
# Runs on every push to main that touches app.json or release-notes/: if the version in
# app.json has no release yet, it builds and publishes `v<version>` (using
# release-notes/v<version>.md when present). To ship a new version, bump "version" in
# app.json, add release notes, and push. It can also be started from the Actions tab.
on:
  push:
    branches: [main]
    paths: ['app.json', 'release-notes/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./app.json').expo.version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Will build and publish $TAG."
          fi

  android:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: |
          npm run typecheck
          npm run lint
          npx jest --ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: 1

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        env:
          NODE_ENV: production

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          APK="Drift-${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          {
            if [ -f "release-notes/${TAG}.md" ]; then cat "release-notes/${TAG}.md"; else echo "Drift ${VERSION}"; fi
            echo
            echo "---"
            echo "**Install on Android:** download \`${APK}\` on your phone, open it and allow installs from your browser or file manager when asked. Works on 32- and 64-bit ARM phones. This is a debug-signed test build (not for the Play Store)."
          } > notes.md
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Drift ${VERSION}" --notes-file notes.md --prerelease
