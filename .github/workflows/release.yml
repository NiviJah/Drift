name: Release

# Push a version tag (e.g. `git tag v1.0.1 && git push origin v1.0.1`) to build the
# Android test APK and publish it as a GitHub Release. Can also be run manually.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v1.0.1)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: |
          npm run typecheck
          npm run lint
          npx jest --ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: 1

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        env:
          NODE_ENV: production

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          APK="Drift-${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          NOTES_FILE="release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then NOTES=$(cat "$NOTES_FILE"); else NOTES="Drift ${VERSION}"; fi
          NOTES="${NOTES}

          ---
          **Install on Android:** download \`${APK}\` on your phone, open it and allow installs from your browser or file manager when asked. This is a debug-signed test build (not for the Play Store)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Drift ${VERSION}" --notes "$NOTES" --prerelease
          fi
